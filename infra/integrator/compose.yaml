name: converter-pro-integrator

services:
  backend:
    build:
      context: ../../backend/image_extractor
      dockerfile: Dockerfile
    image: converter-pro-backend:integrator
    container_name: converter-pro-backend
    restart: unless-stopped
    env_file:
      - ${CONVERTER_ENV_FILE:-/opt/converter-pro/config/backend.env}
    environment:
      PORT: "8000"
      MAX_CONCURRENT_JOBS: "1"
      ADMIN_TOKEN_FILE: /app/admin_config/admin_token
      SERVER_ID: integrator
      # Upload do Starlette vai pra DISCO, nao pro /tmp (que e tmpfs em RAM,
      # 256m). Sem isso o catalogo TUKA TOYS (435,7MB) morria em
      # "error parsing the body" ao encher o tmpfs por volta dos 272MB --
      # e a IA nunca rodava (achado real 10/09/2026). Disco tem 87GB livres;
      # manter em RAM ainda comeria o limite de 5g do container.
      TMPDIR: /app/uploads_tmp
    ports:
      - "127.0.0.1:28081:8000"
    volumes:
      - ${CONVERTER_DATA_DIR:-/opt/converter-pro/data}/temp:/app/temp
      - ${CONVERTER_DATA_DIR:-/opt/converter-pro/data}/supplier_profiles:/app/supplier_profiles
      # Fora de data/temp de proposito: a limpeza de 21 dias varre data/temp na
      # profundidade 1 e apagaria este diretorio, quebrando todo upload seguinte.
      - ${CONVERTER_DATA_DIR:-/opt/converter-pro/data}/uploads_tmp:/app/uploads_tmp
      - ${CONVERTER_ADMIN_DIR:-/opt/converter-pro/config/admin}:/app/admin_config
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
    mem_limit: 5g
    mem_reservation: 1g
    memswap_limit: 6g
    cpus: 3.5
    pids_limit: 512
    shm_size: 256m
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
